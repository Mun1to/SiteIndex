<!--
  JSON-LD, plantilla de SiteIndex.
  Copia SOLO los bloques que apliquen a la página y borra el resto.

  Dos reglas que no se saltan:
  1. El JSON-LD describe lo que se VE en la página. Marcar lo que no está visible
     (valoraciones inventadas, preguntas que no existen) es motivo de penalización.
  2. Valídalo en la prueba de resultados enriquecidos de Google antes de darlo por bueno.
     Los campos obligatorios de cada tipo cambian: comprueba la galería de resultados
     enriquecidos de Search Central en el momento, no de memoria.
-->

<!-- ORGANIZATION: en la portada. Quién eres, para que te entiendan como entidad. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{Nombre}}",
  "url": "https://tudominio.com",
  "logo": "https://tudominio.com/logo.png",
  "description": "{{Qué hacéis, en una frase}}",
  "sameAs": [
    "https://github.com/{{usuario}}",
    "https://www.linkedin.com/company/{{empresa}}"
  ]
}
</script>

<!-- WEBSITE: en la portada, junto al anterior. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{Nombre del sitio}}",
  "url": "https://tudominio.com",
  "inLanguage": "es"
}
</script>

<!-- ARTICLE: en cada entrada del blog. El autor firma: cuenta para E-E-A-T. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{Título del artículo}}",
  "description": "{{Resumen en una frase}}",
  "image": "https://tudominio.com/{{imagen-del-articulo}}.png",
  "datePublished": "{{2026-01-31}}",
  "dateModified": "{{2026-01-31}}",
  "author": {
    "@type": "Person",
    "name": "{{Nombre de quien escribe}}",
    "url": "https://tudominio.com/sobre-mi"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{Nombre}}",
    "logo": {
      "@type": "ImageObject",
      "url": "https://tudominio.com/logo.png"
    }
  },
  "mainEntityOfPage": "https://tudominio.com/blog/{{ruta}}"
}
</script>

<!-- FAQPAGE: solo si esas preguntas ESTÁN visibles en la página.
     Es también el formato que mejor leen los asistentes de IA. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "{{La pregunta tal y como la haría alguien}}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{La respuesta directa en las dos primeras frases, y luego el matiz.}}"
      }
    },
    {
      "@type": "Question",
      "name": "{{Segunda pregunta}}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{Segunda respuesta}}"
      }
    }
  ]
}
</script>

<!-- BREADCRUMBLIST: en páginas internas. Sustituye la URL fea por la ruta en el resultado. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Inicio", "item": "https://tudominio.com" },
    { "@type": "ListItem", "position": 2, "name": "{{Sección}}", "item": "https://tudominio.com/{{seccion}}" },
    { "@type": "ListItem", "position": 3, "name": "{{Esta página}}" }
  ]
}
</script>

<!-- LOCALBUSINESS: solo si atiendes clientes en un sitio físico o en una zona.
     Los datos tienen que ser LOS MISMOS que los del Perfil de Empresa de Google:
     una dirección escrita de dos formas distintas es una señal partida en dos.
     Elige el subtipo exacto si existe (Restaurant, Dentist, HairSalon...). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "{{Nombre del negocio}}",
  "image": "https://tudominio.com/img/local.jpg",
  "url": "https://tudominio.com",
  "telephone": "+34600000000",
  "priceRange": "{{€€}}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{Calle y número}}",
    "addressLocality": "{{Ciudad}}",
    "postalCode": "{{CP}}",
    "addressCountry": "ES"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "{{00.0000}}",
    "longitude": "{{-0.0000}}"
  },
  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
      "opens": "09:00",
      "closes": "18:00"
    }
  ],
  "areaServed": "{{Ciudad o provincia que atiendes}}",
  "sameAs": [
    "https://www.google.com/maps/place/{{tu-ficha}}",
    "https://www.linkedin.com/company/{{tu-empresa}}"
  ]
}
</script>

<!-- SOFTWAREAPPLICATION: para una app, una herramienta o una skill.
     Obligatorios segun Google: name, offers.price (0 si es gratis) y aggregateRating O review.
     Recomendados: operatingSystem y applicationCategory.
     NUNCA inventes valoraciones: las resenas falsas, las incentivadas sin declarar y las
     copiadas de otras webs estan prohibidas. Si no tienes valoraciones reales, borra el
     bloque aggregateRating y deja el resto: pierdes la estrella, no la ficha. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "{{Nombre del producto}}",
  "description": "{{Que hace y para quien, en una frase}}",
  "url": "https://tudominio.com",
  "applicationCategory": "{{MultimediaApplication, DeveloperApplication, BusinessApplication...}}",
  "operatingSystem": "Windows 10, Windows 11",
  "softwareVersion": "{{1.0.0}}",
  "datePublished": "{{2026-01-01}}",
  "downloadUrl": "https://tudominio.com/descargar",
  "installUrl": "https://tudominio.com/descargar",
  "fileSize": "{{25 MB}}",
  "license": "https://opensource.org/licenses/MIT",
  "screenshot": "https://tudominio.com/img/captura.png",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "EUR"
  },
  "author": {
    "@type": "Person",
    "name": "{{Quien lo hace}}",
    "url": "https://tudominio.com/sobre-mi"
  }
}
</script>

<!-- VIDEOOBJECT: si la pagina lleva un video de demostracion.
     El texto se indexa y el video no, asi que pon tambien la transcripcion en la pagina. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoObject",
  "name": "{{Titulo del video}}",
  "description": "{{Que se ve en el video}}",
  "thumbnailUrl": "https://tudominio.com/img/miniatura.jpg",
  "uploadDate": "{{2026-01-01}}",
  "duration": "PT2M30S",
  "contentUrl": "https://tudominio.com/video/demo.mp4",
  "embedUrl": "https://www.youtube.com/embed/{{id}}"
}
</script>
